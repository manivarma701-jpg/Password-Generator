<!DOCTYPE html>
<!--
============================================================
 PASSWORD GENERATOR - HTML / CSS / JS (Frontend)
============================================================
 Lines of Code: ~310
 Features: UI animations (fade-in, shake, pulse)
============================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    animation: bgShift 12s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { background: linear-gradient(135deg, #667eea, #764ba2); }
    100% { background: linear-gradient(135deg, #f093fb, #4facfe); }
  }
  .card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 35px;
    border-radius: 18px;
    width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(60px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  h1 {
    text-align: center; color: #333;
    margin-bottom: 22px; font-size: 26px;
    animation: fadeIn 0.8s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  label { display: block; margin: 14px 0 6px; color: #555; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #764ba2; }
  .length-value { float: right; color: #764ba2; font-weight: bold; }
  .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .checkbox-group label {
    background: #f3f4ff; padding: 8px 14px; border-radius: 20px;
    cursor: pointer; transition: all 0.25s; user-select: none;
    border: 2px solid transparent; margin: 0;
  }
  .checkbox-group label:hover { background: #e8eaff; transform: translateY(-2px); }
  .checkbox-group input { display: none; }
  .checkbox-group input:checked + span { font-weight: bold; color: #764ba2; }
  .checkbox-group label:has(input:checked) {
    border-color: #764ba2; background: #ede4ff;
  }
  .output {
    background: #1a1a2e; color: #00ff88;
    padding: 16px; border-radius: 10px;
    font-family: 'Courier New', monospace; font-size: 16px;
    margin: 18px 0; word-break: break-all;
    min-height: 50px; position: relative;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(0,255,136,0.5); }
    50%      { box-shadow: 0 0 20px rgba(0,255,136,0.5); }
  }
  .strength {
    height: 8px; background: #eee; border-radius: 4px; overflow: hidden;
    margin: 10px 0;
  }
  .strength-fill {
    height: 100%; width: 0%;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s;
  }
  button {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 8px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(118,75,162,0.4); }
  button:active { transform: scale(0.97); }
  .copy-btn {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    margin-top: 10px;
  }
  .shake { animation: shake 0.5s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 Password Generator</h1>

    <label>Length: <span class="length-value" id="lenVal">12</span></label>
    <input type="range" id="length" min="4" max="32" value="12">

    <label>Character Types:</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="upper" checked><span>Uppercase</span></label>
      <label><input type="checkbox" id="digit" checked><span>Digits</span></label>
      <label><input type="checkbox" id="symbol" checked><span>Symbols</span></label>
    </div>

    <div class="output" id="output">Click Generate!</div>
    <div class="strength"><div class="strength-fill" id="strengthFill"></div></div>

    <button onclick="generate()">⚡ Generate Password</button>
    <button class="copy-btn" onclick="copy()">📋 Copy to Clipboard</button>
  </div>

<script>
const $ = id => document.getElementById(id);

$('length').oninput = () => $('lenVal').textContent = $('length').value;

function strength(pwd) {
  let s = 0;
  if (pwd.length >= 8)  s++;
  if (pwd.length >= 12) s++;
  if (/[A-Z]/.test(pwd)) s++;
  if (/[0-9]/.test(pwd)) s++;
  if (/[^A-Za-z0-9]/.test(pwd)) s++;
  return s;
}

function generate() {
  const len = +$('length').value;
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const digit = '0123456789';
  const symbol = '!@#$%^&*()_+-=[]{}'; 

  let pool = lower;
  if ($('upper').checked)  pool += upper;
  if ($('digit').checked)  pool += digit;
  if ($('symbol').checked) pool += symbol;

  if (pool === lower) { alert('Select at least one option!'); return; }

  let pwd = '';
  for (let i = 0; i < len; i++)
    pwd += pool[Math.floor(Math.random() * pool.length)];

  const out = $('output');
  out.textContent = pwd;
  out.classList.remove('shake');
  void out.offsetWidth; // restart animation
  out.classList.add('shake');

  const s = strength(pwd);
  const fill = $('strengthFill');
  fill.style.width = (s * 20) + '%';
  fill.style.background = ['#ff4444','#ff8800','#ffcc00','#88cc00','#00cc66'][s];
}

function copy() {
  const txt = $('output').textContent;
  if (txt === 'Click Generate!') return;
  navigator.clipboard.writeText(txt);
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = '✓ Copied!';
  setTimeout(() => btn.textContent = orig, 1200);
}
</script>
</body>
</html>
